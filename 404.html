<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · AlphaCore Solutions</title>

<link rel="icon" type="image/png" href="/favicon.png">
<!-- Página 404 de Cloudflare Pages: cualquier ruta inexistente aterriza aquí
     con estado 404 (antes devolvía la home con 200). Bilingüe, sin JS. -->
<style>
  html,body{margin:0;min-height:100%;background:#0A0D14;color:#E7EEF6;font-family:'Segoe UI',Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  main{max-width:520px}
  img{height:56px;margin-bottom:28px}
  h1{font-size:28px;margin:0 0 10px;letter-spacing:-.5px}
  p{color:#8FA3B8;font-size:16px;line-height:1.6;margin:0 0 8px}
  .code{color:#23BCDC;font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:2px;margin-bottom:18px}
  .btn{display:inline-block;margin-top:26px;background:#23BCDC;color:#0A0D14;font-weight:700;padding:14px 26px;border-radius:11px;text-decoration:none}
  .alt{display:block;margin-top:18px;color:#23BCDC;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="AlphaCore Solutions">
  <div class="code">404</div>
  <h1>Esta página no existe</h1>
  <p>El enlace puede estar mal escrito o la página ya no está disponible.</p>
  <p><em>This page doesn't exist. The link may be misspelled or the page is no longer available.</em></p>
  <a class="btn" href="/">Ir al inicio / Go home</a>
  <a class="alt" href="tel:+16123244413">Llámanos / Call us: 612-324-4413</a>
</main>
</body>
